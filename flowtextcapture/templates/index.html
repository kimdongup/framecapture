<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08111f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg">
  <title>FlowTextCapture</title>
  <style>
    :root{color-scheme:dark;--bg:#08111f;--card:#111e31;--line:#29405f;--accent:#59c3ff;--muted:#9cb0c9;--good:#47d7a0}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#17345a,var(--bg) 45%);font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f4f8ff}
    .wrap{max-width:1040px;margin:auto;padding:clamp(20px,5vw,56px)}h1{font-size:clamp(30px,6vw,56px);margin:0 0 8px;letter-spacing:-.04em}.lead{max-width:760px;color:var(--muted);line-height:1.6;margin:0 0 28px}
    .card{background:color-mix(in srgb,var(--card) 94%,transparent);border:1px solid var(--line);border-radius:22px;padding:clamp(18px,4vw,32px);box-shadow:0 20px 70px #0006}
    .drop{display:block;border:1.5px dashed #4f769f;border-radius:16px;padding:28px;text-align:center;cursor:pointer;background:#0b1727}.drop strong{display:block;font-size:18px}.drop small{display:block;color:var(--muted);margin-top:6px}.drop input{display:block;width:100%;margin-top:14px}
    .editor{display:none;margin-top:22px}.video-shell{overflow:hidden;border:1px solid var(--line);border-radius:16px;background:#02060c}.video-shell video{display:block;width:100%;max-height:480px;background:#000}
    .trim{margin-top:18px;padding:18px;border:1px solid var(--line);border-radius:16px;background:#0a1524}.trim-head,.time-values,.mark-buttons{display:flex;align-items:center;justify-content:space-between;gap:12px}.trim-head h2{font-size:17px;margin:0}.selection{color:var(--accent);font-variant-numeric:tabular-nums}.timeline{position:relative;height:42px;margin:14px 0}.timeline-track,.timeline-fill{position:absolute;top:18px;height:8px;border-radius:99px}.timeline-track{left:0;right:0;background:#26374e}.timeline-fill{background:var(--accent);pointer-events:none}
    .timeline input[type=range]{position:absolute;inset:0;width:100%;height:42px;margin:0;background:transparent;appearance:none;pointer-events:none}.timeline input[type=range]::-webkit-slider-thumb{appearance:none;width:22px;height:22px;border:4px solid white;border-radius:50%;background:var(--accent);box-shadow:0 2px 10px #0008;pointer-events:auto;cursor:grab}.timeline input[type=range]::-moz-range-thumb{width:15px;height:15px;border:4px solid white;border-radius:50%;background:var(--accent);pointer-events:auto;cursor:grab}.timeline input[type=range]::-webkit-slider-runnable-track{background:transparent}.timeline input[type=range]::-moz-range-track{background:transparent}
    .time-values{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}.mark-buttons{margin-top:16px}.secondary{width:auto;flex:1;background:#182a42;border:1px solid #385372;font-weight:650}.hint{margin:12px 0 0;color:var(--muted);font-size:13px;line-height:1.5}
    details{margin:20px 0}summary{cursor:pointer;color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}label span{display:block;color:var(--muted);font-size:13px;margin:0 0 6px}input,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#0a1524;color:white}.checks{display:flex;gap:18px;margin:18px 0;flex-wrap:wrap}.checks label{display:flex;align-items:center;gap:8px}.checks input{width:auto}
    button,.download{border:0;border-radius:12px;padding:14px;background:linear-gradient(110deg,#27aef4,#6d7cff);color:white;font-weight:750;font-size:16px;cursor:pointer;text-align:center;text-decoration:none}.primary{width:100%}button:disabled{opacity:.5}.status{display:none;margin-top:22px}.bar{height:10px;background:#07101d;border-radius:99px;overflow:hidden}.bar i{display:block;width:0;height:100%;background:var(--accent);transition:width .25s}.downloads{display:none;margin-top:20px;padding:18px;border:1px solid #277058;border-radius:16px;background:#0c2a25}.downloads h2{margin:0 0 6px;font-size:18px}.downloads p{color:#a7dcca;margin:0 0 15px}.links{display:flex;gap:10px;flex-wrap:wrap}.download{display:inline-block;background:var(--good);color:#05251a}.download.alt{background:#203754;color:#d9ecff}
    @media(max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.grid{grid-template-columns:1fr}.wrap{padding:18px}.card{border-radius:16px}.drop{padding:22px}.mark-buttons{flex-direction:column}.secondary{width:100%}.trim-head{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<main class="wrap">
  <h1>영상 속 글자를<br>텍스트로.</h1>
  <p class="lead">영상을 미리 보면서 필요한 구간을 지정하세요. 선택한 구간에 대해서만 텍스트 영역 감지, 중복 제거, OCR과 맞춤법 후처리를 실행합니다.</p>
  <section class="card">
    <form id="form">
      <label class="drop">
        <strong>동영상 선택</strong><small>파일을 선택하면 구간 편집 화면이 표시됩니다.</small>
        <input id="video-file" required type="file" name="video" accept="video/*">
      </label>

      <section id="editor" class="editor" aria-label="영상 구간 선택">
        <div class="video-shell"><video id="preview" controls playsinline preload="metadata"></video></div>
        <div class="trim">
          <div class="trim-head"><h2>추출할 구간</h2><strong id="selection" class="selection">00:00.0 — 00:00.0</strong></div>
          <div class="timeline">
            <div class="timeline-track"></div><div id="timeline-fill" class="timeline-fill"></div>
            <input id="start-range" type="range" min="0" max="1" step="0.1" value="0" aria-label="시작 위치">
            <input id="end-range" type="range" min="0" max="1" step="0.1" value="1" aria-label="종료 위치">
          </div>
          <div class="time-values"><span>0:00</span><span id="duration-label">0:00</span></div>
          <div class="mark-buttons">
            <button type="button" id="mark-start" class="secondary">현재 재생 위치를 시작점으로</button>
            <button type="button" id="mark-end" class="secondary">현재 재생 위치를 종료점으로</button>
          </div>
          <p class="hint">두 원형 핸들을 움직이거나 영상을 재생한 뒤 버튼을 눌러 범위를 지정할 수 있습니다.</p>
          <input id="start-value" name="start" type="hidden" value="0">
          <input id="end-value" name="end" type="hidden" value="">
        </div>
      </section>

      <details><summary>고급 설정</summary><div class="grid">
        <label><span>프레임 간격 (0 = 모든 프레임)</span><input name="interval" type="number" min="0" step="0.1" value="0"></label>
        <label><span>중복 기준</span><input name="similarity" type="number" min="0.8" max="0.999" step="0.001" value="0.98"></label>
        <label><span>OCR 엔진</span><select name="engine"><option value="auto">자동 (Mac: Apple / Windows: Tesseract)</option><option value="apple">Apple Vision</option><option value="tesseract">Tesseract</option></select></label>
        <label><span>언어</span><input name="language" value="ko,en"></label>
      </div></details>
      <div class="checks"><label><input type="checkbox" name="spellcheck" checked> 맞춤법 후처리</label><label><input type="checkbox" name="keep_frames"> 원본 프레임 보관</label></div>
      <button id="run" class="primary">선택 구간에서 텍스트 추출</button>
    </form>

    <div id="status" class="status"><p id="message">준비 중</p><div class="bar"><i id="bar"></i></div></div>
    <section id="downloads" class="downloads"><h2>결과 파일이 준비되었습니다</h2><p>원하는 형식의 텍스트 파일을 내려받으세요.</p><div id="links" class="links"></div></section>
  </section>
</main>
<script>
const $=selector=>document.querySelector(selector);
const form=$('#form'),file=$('#video-file'),preview=$('#preview'),editor=$('#editor');
const startRange=$('#start-range'),endRange=$('#end-range'),startValue=$('#start-value'),endValue=$('#end-value');
const selection=$('#selection'),fill=$('#timeline-fill'),durationLabel=$('#duration-label');
const run=$('#run'),statusEl=$('#status'),msg=$('#message'),bar=$('#bar'),downloads=$('#downloads'),links=$('#links');
let objectUrl=null,duration=0;
function stamp(seconds){seconds=Math.max(0,Number(seconds)||0);const m=Math.floor(seconds/60),s=(seconds%60).toFixed(1).padStart(4,'0');return `${String(m).padStart(2,'0')}:${s}`}
function syncTrim(changed){let start=Number(startRange.value),end=Number(endRange.value);if(changed==='start'&&start>end-.1)start=Math.max(0,end-.1);if(changed==='end'&&end<start+.1)end=Math.min(duration,start+.1);startRange.value=start;endRange.value=end;startValue.value=start.toFixed(1);endValue.value=end.toFixed(1);selection.textContent=`${stamp(start)} — ${stamp(end)}`;fill.style.left=(start/duration*100)+'%';fill.style.width=((end-start)/duration*100)+'%'}
file.addEventListener('change',()=>{if(objectUrl)URL.revokeObjectURL(objectUrl);if(!file.files[0]){editor.style.display='none';return}objectUrl=URL.createObjectURL(file.files[0]);preview.src=objectUrl;editor.style.display='block';downloads.style.display='none'});
preview.addEventListener('loadedmetadata',()=>{duration=preview.duration;startRange.max=endRange.max=duration;startRange.value=0;endRange.value=duration;durationLabel.textContent=stamp(duration);syncTrim()});
startRange.addEventListener('input',()=>{syncTrim('start');preview.currentTime=Number(startRange.value)});endRange.addEventListener('input',()=>{syncTrim('end');preview.currentTime=Number(endRange.value)});
$('#mark-start').onclick=()=>{startRange.value=Math.min(preview.currentTime,Number(endRange.value)-.1);syncTrim('start')};
$('#mark-end').onclick=()=>{endRange.value=Math.max(preview.currentTime,Number(startRange.value)+.1);syncTrim('end')};
preview.addEventListener('timeupdate',()=>{if(preview.currentTime>=Number(endRange.value)&&!preview.paused){preview.pause();preview.currentTime=Number(startRange.value)}});
form.onsubmit=async event=>{event.preventDefault();if(!duration)return;run.disabled=true;statusEl.style.display='block';downloads.style.display='none';links.innerHTML='';msg.textContent='동영상 업로드 중…';bar.style.width='0%';try{const response=await fetch('/api/jobs',{method:'POST',body:new FormData(form)}),job=await response.json();if(!response.ok)throw Error(job.error);poll(job.id)}catch(error){msg.textContent=error.message;run.disabled=false}};
async function saveResult(job,type){
  const api=window.pywebview&&window.pywebview.api;
  if(api&&api.save_result){
    try{const result=await api.save_result(job,type);msg.textContent=result.message;if(result.ok)statusEl.style.display='block'}catch(error){msg.textContent='파일 저장 중 오류: '+error}
    return;
  }
  const anchor=document.createElement('a');anchor.href=`/results/${encodeURIComponent(job)}/${type==='corrected'?'corrected.txt':'extracted.txt'}`;anchor.download=type==='corrected'?'FlowTextCapture_교정본.txt':'FlowTextCapture_OCR원문.txt';document.body.appendChild(anchor);anchor.click();anchor.remove();
}
async function poll(id){try{const response=await fetch('/api/jobs/'+id),job=await response.json();msg.textContent=job.message;bar.style.width=(job.progress||0)+'%';if(job.status==='done'){downloads.style.display='block';links.innerHTML=`<button type="button" class="download" onclick="saveResult('${job.result}','corrected')">교정된 텍스트 저장</button><button type="button" class="download alt" onclick="saveResult('${job.result}','extracted')">OCR 원문 저장</button>`;run.disabled=false}else if(job.status==='error'){run.disabled=false}else setTimeout(()=>poll(id),700)}catch(error){msg.textContent=error.message;run.disabled=false}}
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('/static/sw.js');
</script>
</body>
</html>
